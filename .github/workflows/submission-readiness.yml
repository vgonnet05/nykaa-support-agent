name: Submission readiness

on:
  push:
    branches:
      - submission-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: submission-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-submission-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MOCK_LLM: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run API-key-free submission checks
        run: python run_submission_checks.py

      - name: Commit generated submission evidence to the readiness branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts/ task7_tool_evidence.json task14_review_evidence.json quality_evaluation_report.json
          if git diff --cached --quiet; then
            echo "No generated evidence changes to commit."
          else
            git commit -m "Add generated capstone submission transcripts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            gh workflow run submission-readiness.yml --ref "${GITHUB_REF_NAME}"
          fi

      - name: Upload generated transcripts and evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-transcripts
          path: |
            transcripts/
            task7_tool_evidence.json
            task14_review_evidence.json
            quality_evaluation_report.json
          if-no-files-found: warn
